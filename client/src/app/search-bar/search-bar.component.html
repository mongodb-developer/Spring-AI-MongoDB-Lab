<div class="form-wrapper">
  <form [formGroup]="searchForm" class="search-form" (submit)="$event.preventDefault()">
    <div class="search-row">
      <!-- Query input -->
      <mat-form-field class="query-field" appearance="outline">
        <mat-label>Find books...</mat-label>

        <input
          matInput
          formControlName="query"
          (keydown.enter)="onEnter($event)"
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          aria-label="Search"
          (click)="onSearch()"
        >
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>

      <!-- Year from -->
      <mat-form-field class="year-field" appearance="outline">
        <mat-label>From</mat-label>
        <input
          matInput
          type="number"
          formControlName="yearFrom"
          placeholder="e.g. 1990"
          (keydown.enter)="onEnter($event)"
          (change)="onSearch()"
        />
      </mat-form-field>

      <!-- Year to -->
      <mat-form-field class="year-field" appearance="outline">
        <mat-label>To</mat-label>
        <input
          matInput
          type="number"
          formControlName="yearTo"
          placeholder="e.g. 2005"
          (keydown.enter)="onEnter($event)"
          (change)="onSearch()"
        />
      </mat-form-field>

      <!-- Search type dropdown -->
      <select
        matNativeControl
        formControlName="searchType"
        class="search-type-native"
        aria-label="Search type"
        (change)="onSearch()"
      >
        <option value="keyword">Keyword</option>
        <option value="semantic">Semantic</option>
      </select>
    </div>
  </form>
</div>
