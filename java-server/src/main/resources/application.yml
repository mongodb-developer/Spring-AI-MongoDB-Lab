spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: library
  security:
    user:
      password: password
  mvc:
    log-request-details: true
  application:
    name: libraryapp
  ai:
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      embedding:
        model: qwen3-embedding:0.6b
      chat:
        model: qwen2.5:1.5b
        options:
          num-predict: 150
    vectorstore:
      mongodb:
        initialize-schema: true
        collection-name: books_embedded
        index-name: vector_index
        path-name: embedding

server:
  port: 5400

logging:
  level:
    org:
      springframework:
        web: DEBUG
        data:
          mongodb: DEBUG
jwt:
  secret: mySuperSecretKeyWithEnoughLength!

embeddings:
  source: ${EMBEDDING_SOURCE:serverlessEndpoint}
openai:
  base-url: https://api.openai.com
  model: text-embedding-3-small
  api-key: ${OPENAI_KEY:yourKey}
vertex:
  base-url: https://us-central1-aiplatform.googleapis.com
  model: multimodalembedding@001
  project-id: ${VERTEX_PROJECT_ID:yourProjectId}
  api-key: ${VERTEX_KEY:yourKey}
voyage:
  base-url: https://api.voyageai.com/v1
  model: voyage-3-large
  output-dimension: 2048
  api-key: ${VOYAGE_KEY:yourKey}
serverlessEndpoint:
  base-url: https://us-central1-projectphoenix-verteximage.cloudfunctions.net